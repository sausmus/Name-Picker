<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student Name Picker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      max-width: 1050px;
      margin: 0 auto;
    }

    /* -----------------------------
       HEADER
    ------------------------------ */

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
    }

    .header p {
      margin: 8px 0 0;
      color: #5f6368;
      font-size: 16px;
    }

    /* -----------------------------
       CARDS
    ------------------------------ */

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .section-title {
      text-align: center;
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
    }

    /* -----------------------------
       BUTTONS
    ------------------------------ */

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #e8eaed;
      color: #202124;
      transition:
        background 0.15s ease,
        transform 0.1s ease,
        box-shadow 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #dadce0;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .period-button.selected {
      background: #1a73e8;
      color: white;
    }

    .primary-button {
      background: #1a73e8;
      color: white;
      font-weight: bold;
    }

    .primary-button:hover:not(:disabled) {
      background: #1765cc;
    }

    .remove-button {
      background: #188038;
      color: white;
      font-weight: bold;
    }

    .remove-button:hover {
      background: #137333;
    }

    .keep-button {
      background: #e8eaed;
      color: #202124;
      font-weight: bold;
    }

    .utility-button {
      background: #e8eaed;
    }

    /* -----------------------------
       PICKER DISPLAY
    ------------------------------ */

    .picker-card {
      text-align: center;
      padding: 34px 22px;
    }

    .current-period-label {
      color: #5f6368;
      font-size: 17px;
      margin-bottom: 18px;
    }

    .name-display {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 16px;
      background: #f8f9fa;
      border: 1px solid #dadce0;
      margin-bottom: 22px;
    }

    .student-name {
      font-size: clamp(42px, 8vw, 88px);
      font-weight: 700;
      line-height: 1.05;
      transition:
        transform 0.08s ease,
        opacity 0.08s ease;
    }

    .student-name.cycling {
      transform: scale(0.97);
      opacity: 0.7;
    }

    /* -----------------------------
       COUNTS
    ------------------------------ */

    .status-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      color: #5f6368;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .status-divider {
      color: #bdc1c6;
    }

    /* -----------------------------
       DECISION AREA
    ------------------------------ */

    .spin-area,
    .decision-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .decision-actions {
      display: none;
    }

    .decision-actions.visible {
      display: flex;
    }

    .large-action {
      min-width: 220px;
      padding: 16px 28px;
      font-size: 18px;
    }

    /* -----------------------------
       TOOLBAR
    ------------------------------ */

    .toolbar-card {
      padding: 18px 22px;
    }

    /* -----------------------------
       MODALS
    ------------------------------ */

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(32, 33, 36, 0.55);
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: min(680px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 22px;
      border-bottom: 1px solid #dadce0;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .close-button {
      background: transparent;
      padding: 6px 10px;
      font-size: 26px;
      color: #5f6368;
    }

    .close-button:hover {
      background: #f1f3f4;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-description {
      margin-top: 0;
      color: #5f6368;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 330px;
      resize: vertical;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      outline: none;
    }

    textarea:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 22px 22px;
    }

    /* -----------------------------
       POOL LIST
    ------------------------------ */

    .pool-list {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .pool-name {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .empty-message {
      text-align: center;
      color: #5f6368;
      padding: 30px;
      font-size: 18px;
    }

    /* -----------------------------
       TOAST
    ------------------------------ */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translate(-50%, 15px);
      background: #202124;
      color: white;
      padding: 11px 18px;
      border-radius: 30px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* -----------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .header {
        margin-bottom: 16px;
      }

      .header h1 {
        font-size: 28px;
      }

      .card {
        padding: 18px;
      }

      .picker-card {
        padding: 26px 12px;
      }

      .button-row {
        gap: 8px;
      }

      .button-row button {
        flex-grow: 1;
      }

      .period-button {
        min-width: 70px;
      }

      .large-action {
        width: 100%;
      }

      .decision-actions button {
        flex: 1 1 180px;
      }

      .name-display {
        min-height: 180px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <div class="header">
      <h1>Student Name Picker</h1>
      <p>Random student selection</p>
    </div>


    <!-- PERIOD CARD -->

    <section class="card">

      <h2 class="section-title">
        Period
      </h2>

      <div
        class="button-row"
        id="periodButtons"
      ></div>

    </section>


    <!-- PICKER CARD -->

    <section class="card picker-card">

      <div
        class="current-period-label"
        id="periodLabel"
      >
        Period 1
      </div>


      <div class="name-display">

        <div
          class="student-name"
          id="studentName"
        >
          Ready?
        </div>

      </div>


      <div class="status-row">

        <span id="remainingCount">
          0 remaining
        </span>

        <span class="status-divider">
          •
        </span>

        <span id="selectedCount">
          0 removed
        </span>

        <span class="status-divider">
          •
        </span>

        <span id="classSize">
          0 students
        </span>

      </div>


      <div
        class="spin-area"
        id="spinArea"
      >

        <button
          class="primary-button large-action"
          id="spinButton"
        >
          PICK A STUDENT
        </button>

      </div>


      <div
        class="decision-actions"
        id="decisionActions"
      >

        <button
          class="remove-button large-action"
          id="removeButton"
        >
          Remove From Pool
        </button>

        <button
          class="keep-button large-action"
          id="keepButton"
        >
          Keep In Pool
        </button>

      </div>

    </section>


    <!-- CONTROLS CARD -->

    <section class="card toolbar-card">

      <div class="button-row">

        <button
          class="utility-button"
          id="rosterButton"
        >
          Edit Roster
        </button>

        <button
          class="utility-button"
          id="poolButton"
        >
          View Pool
        </button>

        <button
          class="utility-button"
          id="undoButton"
        >
          ↶ Undo
        </button>

        <button
          class="utility-button"
          id="resetButton"
        >
          ↻ Reset Pool
        </button>

      </div>

    </section>

  </main>


  <!-- ROSTER MODAL -->

  <div
    class="modal-overlay"
    id="rosterModal"
  >

    <div class="modal">

      <div class="modal-header">

        <h2 id="rosterModalTitle">
          Period 1 Roster
        </h2>

        <button
          class="close-button"
          id="closeRosterModal"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <p class="modal-description">
          Paste one student name per line.
          Your roster will be saved automatically
          in this browser.
        </p>

        <textarea
          id="rosterInput"
          placeholder="Abigail Smith
Bobby Horn
Harrison Hyun
James Martinez"
        ></textarea>

      </div>


      <div class="modal-footer">

        <button id="cancelRosterButton">
          Cancel
        </button>

        <button
          class="primary-button"
          id="saveRosterButton"
        >
          Save Roster
        </button>

      </div>

    </div>

  </div>


  <!-- POOL MODAL -->

  <div
    class="modal-overlay"
    id="poolModal"
  >

    <div class="modal">

      <div class="modal-header">

        <h2 id="poolModalTitle">
          Students Remaining
        </h2>

        <button
          class="close-button"
          id="closePoolModal"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <div
          class="pool-list"
          id="poolList"
        ></div>

      </div>

    </div>

  </div>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    /* ==================================================
       STUDENT NAME PICKER
    ================================================== */

    const PERIODS = [
      "1",
      "2",
      "3",
      "4",
      "5",
      "6",
      "7"
    ];

    /*
      Keep the same storage key so any rosters
      you already entered in Periods 1, 2, 3,
      5, or 6 will remain saved.
    */

    const STORAGE_KEY =
      "studentNamePicker_v1";


    /* ==================================================
       DEFAULT STATE
    ================================================== */

    function createDefaultState() {

      const periods = {};

      PERIODS.forEach(period => {

        periods[period] = {
          masterRoster: [],
          pool: [],
          history: []
        };

      });


      return {
        currentPeriod: "1",
        periods: periods
      };

    }


    /* ==================================================
       SAVE / LOAD
    ================================================== */

    function loadState() {

      const saved =
        localStorage.getItem(STORAGE_KEY);


      if (!saved) {
        return createDefaultState();
      }


      try {

        const parsed =
          JSON.parse(saved);


        if (!parsed.periods) {
          parsed.periods = {};
        }


        PERIODS.forEach(period => {

          if (!parsed.periods[period]) {

            parsed.periods[period] = {
              masterRoster: [],
              pool: [],
              history: []
            };

          }

        });


        if (
          !PERIODS.includes(
            parsed.currentPeriod
          )
        ) {
          parsed.currentPeriod = "1";
        }


        return parsed;

      }

      catch (error) {

        console.error(
          "Unable to load saved data:",
          error
        );

        return createDefaultState();

      }

    }


    function saveState() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

    }


    let state = loadState();


    /* ==================================================
       ELEMENTS
    ================================================== */

    const periodButtons =
      document.getElementById(
        "periodButtons"
      );

    const periodLabel =
      document.getElementById(
        "periodLabel"
      );

    const studentName =
      document.getElementById(
        "studentName"
      );

    const spinButton =
      document.getElementById(
        "spinButton"
      );

    const spinArea =
      document.getElementById(
        "spinArea"
      );

    const decisionActions =
      document.getElementById(
        "decisionActions"
      );

    const removeButton =
      document.getElementById(
        "removeButton"
      );

    const keepButton =
      document.getElementById(
        "keepButton"
      );

    const remainingCount =
      document.getElementById(
        "remainingCount"
      );

    const selectedCount =
      document.getElementById(
        "selectedCount"
      );

    const classSize =
      document.getElementById(
        "classSize"
      );

    const rosterButton =
      document.getElementById(
        "rosterButton"
      );

    const poolButton =
      document.getElementById(
        "poolButton"
      );

    const undoButton =
      document.getElementById(
        "undoButton"
      );

    const resetButton =
      document.getElementById(
        "resetButton"
      );

    const rosterModal =
      document.getElementById(
        "rosterModal"
      );

    const rosterModalTitle =
      document.getElementById(
        "rosterModalTitle"
      );

    const rosterInput =
      document.getElementById(
        "rosterInput"
      );

    const saveRosterButton =
      document.getElementById(
        "saveRosterButton"
      );

    const cancelRosterButton =
      document.getElementById(
        "cancelRosterButton"
      );

    const closeRosterModal =
      document.getElementById(
        "closeRosterModal"
      );

    const poolModal =
      document.getElementById(
        "poolModal"
      );

    const poolModalTitle =
      document.getElementById(
        "poolModalTitle"
      );

    const poolList =
      document.getElementById(
        "poolList"
      );

    const closePoolModal =
      document.getElementById(
        "closePoolModal"
      );

    const toast =
      document.getElementById(
        "toast"
      );


    /* ==================================================
       TEMPORARY SELECTION STATE
    ================================================== */

    let isSpinning = false;

    let pendingStudent = null;


    /* ==================================================
       HELPERS
    ================================================== */

    function currentData() {

      return state.periods[
        state.currentPeriod
      ];

    }


    function randomItem(array) {

      return array[
        Math.floor(
          Math.random() * array.length
        )
      ];

    }


    function wait(milliseconds) {

      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });

    }


    function showToast(message) {

      toast.textContent = message;

      toast.classList.add("show");


      clearTimeout(
        showToast.timeout
      );


      showToast.timeout =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 1800);

    }


    /* ==================================================
       PERIOD BUTTONS
    ================================================== */

    function buildPeriodButtons() {

      periodButtons.innerHTML = "";


      PERIODS.forEach(period => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "period-button";

        button.textContent =
          `Period ${period}`;


        if (
          period ===
          state.currentPeriod
        ) {

          button.classList.add(
            "selected"
          );

        }


        button.addEventListener(
          "click",
          () => {

            if (isSpinning) {
              return;
            }


            state.currentPeriod =
              period;

            pendingStudent =
              null;


            saveState();

            buildPeriodButtons();

            updateUI();

          }
        );


        periodButtons.appendChild(
          button
        );

      });

    }


    /* ==================================================
       UPDATE DISPLAY
    ================================================== */

    function updateUI() {

      const data =
        currentData();

      const total =
        data.masterRoster.length;

      const remaining =
        data.pool.length;

      const removed =
        Math.max(
          total - remaining,
          0
        );


      periodLabel.textContent =
        `Period ${state.currentPeriod}`;


      remainingCount.textContent =
        `${remaining} remaining`;


      selectedCount.textContent =
        `${removed} removed`;


      classSize.textContent =
        `${total} student${
          total === 1 ? "" : "s"
        }`;


      undoButton.disabled =
        data.history.length === 0;


      resetButton.disabled =
        total === 0;


      poolButton.disabled =
        total === 0;


      if (isSpinning) {
        return;
      }


      if (pendingStudent) {

        spinArea.style.display =
          "none";


        decisionActions.classList.add(
          "visible"
        );


        studentName.textContent =
          pendingStudent;


        return;

      }


      decisionActions.classList.remove(
        "visible"
      );


      spinArea.style.display =
        "flex";


      if (total === 0) {

        studentName.textContent =
          "Add a roster to begin";


        spinButton.textContent =
          "ADD ROSTER";


        spinButton.disabled =
          false;


        return;

      }


      if (remaining === 0) {

        studentName.textContent =
          "Everyone has been selected";


        spinButton.textContent =
          "RESET CLASS";


        spinButton.disabled =
          false;


        return;

      }


      studentName.textContent =
        "Ready?";


      spinButton.textContent =
        "PICK A STUDENT";


      spinButton.disabled =
        false;

    }


    /* ==================================================
       PICK STUDENT
    ================================================== */

    async function spin() {

      const data =
        currentData();


      if (
        data.masterRoster.length === 0
      ) {

        openRosterEditor();

        return;

      }


      if (
        data.pool.length === 0
      ) {

        resetPool();

        return;

      }


      if (
        isSpinning ||
        pendingStudent
      ) {
        return;
      }


      isSpinning = true;

      spinButton.disabled =
        true;


      /*
        Select the actual winner before
        animation begins.
      */

      const winner =
        randomItem(data.pool);


      /*
        Rapid at first, then slows.

        Total animation is roughly
        1.5–2 seconds.
      */

      const timings = [
        40,
        40,
        45,
        45,
        50,
        55,
        60,
        65,
        75,
        85,
        100,
        115,
        135,
        160,
        190
      ];


      let previousName = null;


      for (
        let i = 0;
        i < timings.length;
        i++
      ) {

        let cyclingName =
          randomItem(data.pool);


        if (
          data.pool.length > 1
        ) {

          let safety = 0;


          while (
            cyclingName ===
              previousName &&
            safety < 10
          ) {

            cyclingName =
              randomItem(data.pool);

            safety++;

          }

        }


        studentName.classList.add(
          "cycling"
        );


        studentName.textContent =
          cyclingName;


        previousName =
          cyclingName;


        await wait(
          timings[i]
        );


        studentName.classList.remove(
          "cycling"
        );

      }


      await wait(100);


      studentName.textContent =
        winner;


      pendingStudent =
        winner;


      isSpinning =
        false;


      updateUI();

    }


    /* ==================================================
       REMOVE FROM POOL
    ================================================== */

    function removePendingStudent() {

      if (!pendingStudent) {
        return;
      }


      const data =
        currentData();


      data.history.push({

        action: "remove",

        student:
          pendingStudent,

        previousPool:
          [...data.pool]

      });


      data.pool =
        data.pool.filter(
          student =>
            student !==
            pendingStudent
        );


      const removedStudent =
        pendingStudent;


      pendingStudent =
        null;


      saveState();

      updateUI();


      showToast(
        `${removedStudent} removed from pool`
      );

    }


    /* ==================================================
       KEEP IN POOL
    ================================================== */

    function keepPendingStudent() {

      if (!pendingStudent) {
        return;
      }


      const data =
        currentData();


      data.history.push({

        action: "keep",

        student:
          pendingStudent,

        previousPool:
          [...data.pool]

      });


      const keptStudent =
        pendingStudent;


      pendingStudent =
        null;


      saveState();

      updateUI();


      showToast(
        `${keptStudent} stays in the pool`
      );

    }


    /* ==================================================
       RESET POOL
    ================================================== */

    function resetPool() {

      const data =
        currentData();


      if (
        data.masterRoster.length === 0
      ) {
        return;
      }


      data.history.push({

        action: "reset",

        previousPool:
          [...data.pool]

      });


      data.pool =
        [...data.masterRoster];


      pendingStudent =
        null;


      saveState();

      updateUI();


      showToast(
        `Period ${state.currentPeriod} pool reset`
      );

    }


    /* ==================================================
       UNDO
    ================================================== */

    function undoLastAction() {

      if (isSpinning) {
        return;
      }


      const data =
        currentData();


      const lastAction =
        data.history.pop();


      if (!lastAction) {

        showToast(
          "Nothing to undo"
        );

        return;

      }


      data.pool =
        [...lastAction.previousPool];


      pendingStudent =
        null;


      saveState();

      updateUI();


      if (
        lastAction.action ===
        "remove"
      ) {

        showToast(
          `${lastAction.student} returned to pool`
        );

      }

      else if (
        lastAction.action ===
        "reset"
      ) {

        showToast(
          "Reset undone"
        );

      }

      else {

        showToast(
          "Last action undone"
        );

      }

    }


    /* ==================================================
       ROSTER EDITOR
    ================================================== */

    function openRosterEditor() {

      const data =
        currentData();


      rosterModalTitle.textContent =
        `Period ${state.currentPeriod} Roster`;


      rosterInput.value =
        data.masterRoster.join(
          "\n"
        );


      rosterModal.classList.add(
        "visible"
      );


      rosterInput.focus();

    }


    function closeRosterEditor() {

      rosterModal.classList.remove(
        "visible"
      );

    }


    function saveRoster() {

      let names =
        rosterInput.value

          .split(/\r?\n/)

          .map(
            name =>
              name.trim()
          )

          .filter(Boolean);


      /*
        Remove exact duplicates.
      */

      names =
        [...new Set(names)];


      const data =
        currentData();


      data.masterRoster =
        names;


      /*
        Changing roster creates a fresh pool.
      */

      data.pool =
        [...names];


      data.history =
        [];


      pendingStudent =
        null;


      saveState();

      closeRosterEditor();

      updateUI();


      showToast(
        `${names.length} students saved`
      );

    }


    /* ==================================================
       VIEW CURRENT POOL
    ================================================== */

    function openPoolViewer() {

      const data =
        currentData();


      poolModalTitle.textContent =
        `Period ${state.currentPeriod} — ${data.pool.length} Remaining`;


      poolList.innerHTML =
        "";


      if (
        data.pool.length === 0
      ) {

        const message =
          document.createElement(
            "div"
          );


        message.className =
          "empty-message";


        message.textContent =
          "No students remain in the pool.";


        poolList.appendChild(
          message
        );

      }

      else {

        const sorted =
          [...data.pool].sort(
            (a, b) =>
              a.localeCompare(b)
          );


        sorted.forEach(name => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "pool-name";


          item.textContent =
            name;


          poolList.appendChild(
            item
          );

        });

      }


      poolModal.classList.add(
        "visible"
      );

    }


    function closePoolViewer() {

      poolModal.classList.remove(
        "visible"
      );

    }


    /* ==================================================
       EVENTS
    ================================================== */

    spinButton.addEventListener(
      "click",
      spin
    );


    removeButton.addEventListener(
      "click",
      removePendingStudent
    );


    keepButton.addEventListener(
      "click",
      keepPendingStudent
    );


    rosterButton.addEventListener(
      "click",
      openRosterEditor
    );


    poolButton.addEventListener(
      "click",
      openPoolViewer
    );


    undoButton.addEventListener(
      "click",
      undoLastAction
    );


    resetButton.addEventListener(
      "click",
      resetPool
    );


    saveRosterButton.addEventListener(
      "click",
      saveRoster
    );


    cancelRosterButton.addEventListener(
      "click",
      closeRosterEditor
    );


    closeRosterModal.addEventListener(
      "click",
      closeRosterEditor
    );


    closePoolModal.addEventListener(
      "click",
      closePoolViewer
    );


    rosterModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          rosterModal
        ) {

          closeRosterEditor();

        }

      }
    );


    poolModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          poolModal
        ) {

          closePoolViewer();

        }

      }
    );


    /*
      SPACEBAR = Pick Student
    */

    document.addEventListener(
      "keydown",
      event => {

        const isTyping =
          document.activeElement
            .tagName ===
          "TEXTAREA";


        if (
          event.code ===
            "Space" &&
          !isTyping &&
          !rosterModal.classList.contains(
            "visible"
          ) &&
          !poolModal.classList.contains(
            "visible"
          )
        ) {

          event.preventDefault();


          if (!pendingStudent) {
            spin();
          }

        }


        if (
          event.key ===
          "Escape"
        ) {

          closeRosterEditor();

          closePoolViewer();

        }

      }
    );


    /* ==================================================
       INITIALIZE
    ================================================== */

    buildPeriodButtons();

    updateUI();

  </script>

</body>
</html>
