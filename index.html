<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Name Picker</title>
  
  <link rel="icon" type="image/png" href="bjh-logo.png">

  <style>

    /* =========================================================
       SHARED BJH APP STYLE
       Matches BJH Class Bell Countdown
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 26px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    .app {
      max-width: 960px;
      margin: auto;
    }


    /* =========================================================
       STANDARD BJH APP HEADER
    ========================================================= */

    .app-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .app-header h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
    }

    .bjh-logo {
      width: 64px;
      height: auto;
      flex-shrink: 0;
    }

    .bjh-logo.right {
      transform: scaleX(-1);
    }


    /* =========================================================
       STANDARD BJH SECTION
    ========================================================= */

    .section {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      min-height: 44px;
      font-size: 16px;

      border: none;
      border-radius: 10px;

      padding: 12px 18px;

      cursor: pointer;

      background: #e8eaed;
      color: #202124;

      transition: .15s;
    }

    button:hover:not(:disabled) {
      background: #dadce0;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button.selected {
      background: #1a73e8;
      color: white;
    }

    button.primary {
      background: #1a73e8;
      color: white;
      font-weight: 700;
    }

    button.primary:hover:not(:disabled) {
      background: #1765cc;
    }

    button.remove {
      background: #188038;
      color: white;
      font-weight: 700;
    }

    button.remove:hover:not(:disabled) {
      background: #137333;
    }


    /* =========================================================
       PERIOD SECTION
    ========================================================= */

    #periodButtons {
      justify-content: flex-start;
    }


    /* =========================================================
       NAME PICKER
    ========================================================= */

    .picker-card {
      text-align: center;
      padding: 32px 20px;
    }

    #periodName {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .picker-subtitle {
      font-size: 15px;
      color: #777;
      margin-bottom: 20px;
    }

    .name-display {
      min-height: 220px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      background: #f8f9fa;

      border: 1px solid #dadce0;
      border-radius: 14px;

      margin: 18px 0 20px;
    }

    #studentName {
      font-size: clamp(52px, 9vw, 96px);
      font-weight: 700;

      line-height: 1.05;

      word-break: break-word;

      transition:
        transform .08s ease,
        opacity .08s ease;
    }

    #studentName.cycling {
      transform: scale(.97);
      opacity: .70;
    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status-row {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 12px;

      flex-wrap: wrap;

      color: #5f6368;

      font-size: 15px;

      margin-bottom: 22px;
    }

    .status-divider {
      color: #bdc1c6;
    }


    /* =========================================================
       MAIN ACTIONS
    ========================================================= */

    .main-actions,
    .decision-actions {
      display: flex;
      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .decision-actions {
      display: none;
    }

    .decision-actions.visible {
      display: flex;
    }

    .large-button {
      min-width: 220px;
      min-height: 52px;

      padding: 14px 25px;

      font-size: 18px;
    }


    /* =========================================================
       SMALL NOTE
    ========================================================= */

    .small-note {
      color: #5f6368;

      font-size: 13px;

      margin-top: 12px;

      line-height: 1.4;
    }


    /* =========================================================
       MODALS
    ========================================================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(32,33,36,.55);

      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: min(680px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      background: white;

      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(0,0,0,.22);
    }

    .modal-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      padding: 20px 22px;

      border-bottom: 1px solid #dadce0;
    }

    .modal-header h2 {
      margin: 0;

      font-size: 22px;
    }

    .close-button {
      min-height: auto;

      padding: 5px 10px;

      background: transparent;

      color: #5f6368;

      font-size: 26px;
    }

    .modal-body {
      padding: 22px;
    }

    textarea {
      width: 100%;

      min-height: 330px;

      resize: vertical;

      border: 1px solid #dadce0;
      border-radius: 10px;

      padding: 14px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;

      outline: none;
    }

    textarea:focus {
      border-color: #1a73e8;

      box-shadow:
        0 0 0 2px rgba(26,115,232,.15);
    }

    .modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      flex-wrap: wrap;

      padding: 0 22px 22px;
    }


    /* =========================================================
       POOL LIST
    ========================================================= */

    .pool-list {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 8px;
    }

    .pool-name {
      padding: 10px 12px;

      background: #f8f9fa;

      border: 1px solid #dadce0;

      border-radius: 8px;
    }

    .empty-message {
      color: #5f6368;

      text-align: center;

      padding: 25px;
    }


    /* =========================================================
       TOAST
    ========================================================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translate(-50%, 15px);

      padding: 11px 18px;

      background: #202124;
      color: white;

      border-radius: 30px;

      opacity: 0;

      pointer-events: none;

      transition: .2s;

      z-index: 2000;
    }

    .toast.show {
      opacity: 1;

      transform: translate(-50%, 0);
    }


    /* =========================================================
       MOBILE
       Matches Bell Countdown header sizing
    ========================================================= */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      button {
        flex-grow: 1;
      }

      .picker-card {
        padding: 26px 12px;
      }

      .app-header {
        gap: 8px;
        margin-bottom: 16px;
      }

      .app-header h1 {
        font-size: 23px;
      }

      .bjh-logo {
        width: 46px;
      }

      .name-display {
        min-height: 180px;
      }

      .large-button {
        width: 100%;
      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       STANDARD BJH APP HEADER
  ====================================================== -->

  <div class="app-header">

    <img
      src="bjh-logo.png"
      class="bjh-logo"
      alt="BJH Bobcat">

    <h1>Random Name Picker</h1>

    <img
      src="bjh-logo.png"
      class="bjh-logo right"
      alt="BJH Bobcat">

  </div>



  <!-- =====================================================
       PERIODS
  ====================================================== -->

  <div class="section">

    <div class="section-title">
      Period
    </div>

    <div
      id="periodButtons"
      class="button-row">
    </div>

  </div>



  <!-- =====================================================
       PICKER
  ====================================================== -->

  <div class="section picker-card">

    <div id="periodName">
      Period 1
    </div>

    <div class="picker-subtitle">
      Random student selection
    </div>


    <div class="name-display">

      <div id="studentName">
        Ready?
      </div>

    </div>


    <div class="status-row">

      <span id="remainingCount">
        0 remaining
      </span>

      <span class="status-divider">
        •
      </span>

      <span id="selectedCount">
        0 removed
      </span>

      <span class="status-divider">
        •
      </span>

      <span id="classSize">
        0 students
      </span>

    </div>


    <div
      id="spinArea"
      class="main-actions">

      <button
        id="spinButton"
        class="primary large-button">

        PICK A STUDENT

      </button>

    </div>


    <div
      id="decisionActions"
      class="decision-actions">

      <button
        id="removeButton"
        class="remove large-button">

        Remove From Pool

      </button>

      <button
        id="keepButton"
        class="large-button">

        Keep In Pool

      </button>

    </div>

  </div>



  <!-- =====================================================
       CONTROLS
  ====================================================== -->

  <div class="section">

    <div class="section-title">
      Controls
    </div>

    <div class="button-row">

      <button id="rosterButton">
        Edit Roster
      </button>

      <button id="poolButton">
        View Pool
      </button>

      <button id="undoButton">
        ↶ Undo
      </button>

      <button id="resetButton">
        ↻ Reset Pool
      </button>

    </div>


    <div class="small-note">

      Rosters and selection pools are remembered
      on this browser profile.

    </div>

  </div>


</div>



<!-- =========================================================
     ROSTER MODAL
========================================================= -->

<div
  id="rosterModal"
  class="modal-overlay">

  <div class="modal">

    <div class="modal-header">

      <h2 id="rosterModalTitle">
        Period 1 Roster
      </h2>

      <button
        id="closeRosterModal"
        class="close-button">
        ×
      </button>

    </div>


    <div class="modal-body">

      <p class="small-note"
         style="margin-top:0; font-size:14px;">

        Paste one student name per line.
        Your roster will be saved in this browser.

      </p>


      <textarea
        id="rosterInput"
        placeholder="Abigail Smith
Bobby Horn
Harrison Hyun
James Martinez"></textarea>

    </div>


    <div class="modal-footer">

      <button id="cancelRosterButton">
        Cancel
      </button>

      <button
        id="saveRosterButton"
        class="primary">

        Save Roster

      </button>

    </div>

  </div>

</div>



<!-- =========================================================
     POOL MODAL
========================================================= -->

<div
  id="poolModal"
  class="modal-overlay">

  <div class="modal">

    <div class="modal-header">

      <h2 id="poolModalTitle">
        Students Remaining
      </h2>

      <button
        id="closePoolModal"
        class="close-button">
        ×
      </button>

    </div>


    <div class="modal-body">

      <div
        id="poolList"
        class="pool-list">
      </div>

    </div>

  </div>

</div>



<div
  id="toast"
  class="toast">
</div>



<script>


/* =========================================================
   SETTINGS
========================================================= */

const PERIODS = [
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7"
];


/*
  Same storage key as earlier versions.

  Your existing roster data will therefore
  continue working.
*/

const STORAGE_KEY =
  "studentNamePicker_v1";



/* =========================================================
   DEFAULT STATE
========================================================= */

function createDefaultState() {

  const periods = {};


  PERIODS.forEach(period => {

    periods[period] = {

      masterRoster: [],

      pool: [],

      history: []

    };

  });


  return {

    currentPeriod: "1",

    periods: periods

  };

}



/* =========================================================
   LOAD / SAVE
========================================================= */

function loadState() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {

    return createDefaultState();

  }


  try {

    const parsed =
      JSON.parse(saved);


    if (!parsed.periods) {

      parsed.periods = {};

    }


    PERIODS.forEach(period => {

      if (!parsed.periods[period]) {

        parsed.periods[period] = {

          masterRoster: [],

          pool: [],

          history: []

        };

      }

    });


    if (
      !PERIODS.includes(
        parsed.currentPeriod
      )
    ) {

      parsed.currentPeriod = "1";

    }


    return parsed;

  }


  catch (error) {

    console.error(
      "Could not load picker data:",
      error
    );


    return createDefaultState();

  }

}



function saveState() {

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(state)

  );

}



let state =
  loadState();



/* =========================================================
   ELEMENTS
========================================================= */

const periodButtons =
  document.getElementById(
    "periodButtons"
  );


const periodName =
  document.getElementById(
    "periodName"
  );


const studentName =
  document.getElementById(
    "studentName"
  );


const spinButton =
  document.getElementById(
    "spinButton"
  );


const spinArea =
  document.getElementById(
    "spinArea"
  );


const decisionActions =
  document.getElementById(
    "decisionActions"
  );


const removeButton =
  document.getElementById(
    "removeButton"
  );


const keepButton =
  document.getElementById(
    "keepButton"
  );


const remainingCount =
  document.getElementById(
    "remainingCount"
  );


const selectedCount =
  document.getElementById(
    "selectedCount"
  );


const classSize =
  document.getElementById(
    "classSize"
  );


const rosterButton =
  document.getElementById(
    "rosterButton"
  );


const poolButton =
  document.getElementById(
    "poolButton"
  );


const undoButton =
  document.getElementById(
    "undoButton"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );


const rosterModal =
  document.getElementById(
    "rosterModal"
  );


const rosterModalTitle =
  document.getElementById(
    "rosterModalTitle"
  );


const rosterInput =
  document.getElementById(
    "rosterInput"
  );


const saveRosterButton =
  document.getElementById(
    "saveRosterButton"
  );


const cancelRosterButton =
  document.getElementById(
    "cancelRosterButton"
  );


const closeRosterModal =
  document.getElementById(
    "closeRosterModal"
  );


const poolModal =
  document.getElementById(
    "poolModal"
  );


const poolModalTitle =
  document.getElementById(
    "poolModalTitle"
  );


const poolList =
  document.getElementById(
    "poolList"
  );


const closePoolModal =
  document.getElementById(
    "closePoolModal"
  );


const toast =
  document.getElementById(
    "toast"
  );



/* =========================================================
   TEMPORARY STATE
========================================================= */

let isSpinning = false;

let pendingStudent = null;



/* =========================================================
   HELPERS
========================================================= */

function currentData() {

  return state.periods[
    state.currentPeriod
  ];

}



function randomItem(array) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}



function wait(milliseconds) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );

}



function showToast(message) {

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    showToast.timeout
  );


  showToast.timeout =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 1800);

}



/* =========================================================
   PERIOD BUTTONS
========================================================= */

function buildPeriodButtons() {

  periodButtons.innerHTML =
    "";


  PERIODS.forEach(period => {

    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      `Period ${period}`;


    if (
      period ===
      state.currentPeriod
    ) {

      button.classList.add(
        "selected"
      );

    }


    button.addEventListener(
      "click",
      () => {

        if (isSpinning) {
          return;
        }


        state.currentPeriod =
          period;


        pendingStudent =
          null;


        saveState();

        buildPeriodButtons();

        updateUI();

      }
    );


    periodButtons.appendChild(
      button
    );

  });

}



/* =========================================================
   UPDATE INTERFACE
========================================================= */

function updateUI() {

  const data =
    currentData();


  const total =
    data.masterRoster.length;


  const remaining =
    data.pool.length;


  const removed =
    Math.max(
      total - remaining,
      0
    );


  periodName.textContent =
    `Period ${state.currentPeriod}`;


  remainingCount.textContent =
    `${remaining} remaining`;


  selectedCount.textContent =
    `${removed} removed`;


  classSize.textContent =
    `${total} student${
      total === 1
        ? ""
        : "s"
    }`;


  undoButton.disabled =
    data.history.length === 0;


  resetButton.disabled =
    total === 0;


  poolButton.disabled =
    total === 0;


  if (isSpinning) {
    return;
  }


  if (pendingStudent) {

    spinArea.style.display =
      "none";


    decisionActions.classList.add(
      "visible"
    );


    studentName.textContent =
      pendingStudent;


    return;

  }


  decisionActions.classList.remove(
    "visible"
  );


  spinArea.style.display =
    "flex";


  if (total === 0) {

    studentName.textContent =
      "Add a roster to begin";


    spinButton.textContent =
      "ADD ROSTER";


    spinButton.disabled =
      false;


    return;

  }


  if (remaining === 0) {

    studentName.textContent =
      "Everyone has been selected";


    spinButton.textContent =
      "RESET CLASS";


    spinButton.disabled =
      false;


    return;

  }


  studentName.textContent =
    "Ready?";


  spinButton.textContent =
    "PICK A STUDENT";


  spinButton.disabled =
    false;

}



/* =========================================================
   RANDOM PICK
========================================================= */

async function spin() {

  const data =
    currentData();


  if (
    data.masterRoster.length === 0
  ) {

    openRosterEditor();

    return;

  }


  if (
    data.pool.length === 0
  ) {

    resetPool();

    return;

  }


  if (
    isSpinning ||
    pendingStudent
  ) {

    return;

  }


  isSpinning =
    true;


  spinButton.disabled =
    true;


  /*
    Pick the actual winner before
    displaying the animation.
  */

  const winner =
    randomItem(
      data.pool
    );


  /*
    Slot-machine style slowdown.
  */

  const timings = [

    40,
    40,
    45,
    45,
    50,
    55,
    60,
    65,
    75,
    85,
    100,
    115,
    135,
    160,
    190

  ];


  let previousName =
    null;


  for (
    let i = 0;
    i < timings.length;
    i++
  ) {

    let cyclingName =
      randomItem(
        data.pool
      );


    if (
      data.pool.length > 1
    ) {

      let safety =
        0;


      while (
        cyclingName ===
          previousName &&
        safety < 10
      ) {

        cyclingName =
          randomItem(
            data.pool
          );


        safety++;

      }

    }


    studentName.classList.add(
      "cycling"
    );


    studentName.textContent =
      cyclingName;


    previousName =
      cyclingName;


    await wait(
      timings[i]
    );


    studentName.classList.remove(
      "cycling"
    );

  }


  await wait(100);


  studentName.textContent =
    winner;


  pendingStudent =
    winner;


  isSpinning =
    false;


  updateUI();

}



/* =========================================================
   REMOVE STUDENT
========================================================= */

function removePendingStudent() {

  if (!pendingStudent) {
    return;
  }


  const data =
    currentData();


  data.history.push({

    action:
      "remove",

    student:
      pendingStudent,

    previousPool:
      [...data.pool]

  });


  data.pool =
    data.pool.filter(
      student =>
        student !==
        pendingStudent
    );


  const removedStudent =
    pendingStudent;


  pendingStudent =
    null;


  saveState();

  updateUI();


  showToast(
    `${removedStudent} removed from pool`
  );

}



/* =========================================================
   KEEP STUDENT
========================================================= */

function keepPendingStudent() {

  if (!pendingStudent) {
    return;
  }


  const data =
    currentData();


  data.history.push({

    action:
      "keep",

    student:
      pendingStudent,

    previousPool:
      [...data.pool]

  });


  const keptStudent =
    pendingStudent;


  pendingStudent =
    null;


  saveState();

  updateUI();


  showToast(
    `${keptStudent} stays in the pool`
  );

}



/* =========================================================
   RESET
========================================================= */

function resetPool() {

  const data =
    currentData();


  if (
    data.masterRoster.length === 0
  ) {

    return;

  }


  data.history.push({

    action:
      "reset",

    previousPool:
      [...data.pool]

  });


  data.pool =
    [...data.masterRoster];


  pendingStudent =
    null;


  saveState();

  updateUI();


  showToast(
    `Period ${state.currentPeriod} pool reset`
  );

}



/* =========================================================
   UNDO
========================================================= */

function undoLastAction() {

  if (isSpinning) {
    return;
  }


  const data =
    currentData();


  const lastAction =
    data.history.pop();


  if (!lastAction) {

    showToast(
      "Nothing to undo"
    );

    return;

  }


  data.pool =
    [...lastAction.previousPool];


  pendingStudent =
    null;


  saveState();

  updateUI();


  if (
    lastAction.action ===
    "remove"
  ) {

    showToast(
      `${lastAction.student} returned to pool`
    );

  }


  else if (
    lastAction.action ===
    "reset"
  ) {

    showToast(
      "Reset undone"
    );

  }


  else {

    showToast(
      "Last action undone"
    );

  }

}



/* =========================================================
   ROSTER EDITOR
========================================================= */

function openRosterEditor() {

  const data =
    currentData();


  rosterModalTitle.textContent =
    `Period ${state.currentPeriod} Roster`;


  rosterInput.value =
    data.masterRoster.join(
      "\n"
    );


  rosterModal.classList.add(
    "visible"
  );


  rosterInput.focus();

}



function closeRosterEditor() {

  rosterModal.classList.remove(
    "visible"
  );

}



function saveRoster() {

  let names =
    rosterInput.value

      .split(/\r?\n/)

      .map(
        name =>
          name.trim()
      )

      .filter(Boolean);


  /*
    Remove exact duplicates.
  */

  names =
    [...new Set(names)];


  const data =
    currentData();


  data.masterRoster =
    names;


  data.pool =
    [...names];


  data.history =
    [];


  pendingStudent =
    null;


  saveState();

  closeRosterEditor();

  updateUI();


  showToast(
    `${names.length} students saved`
  );

}



/* =========================================================
   VIEW POOL
========================================================= */

function openPoolViewer() {

  const data =
    currentData();


  poolModalTitle.textContent =
    `Period ${state.currentPeriod} — ${data.pool.length} Remaining`;


  poolList.innerHTML =
    "";


  if (
    data.pool.length === 0
  ) {

    const message =
      document.createElement(
        "div"
      );


    message.className =
      "empty-message";


    message.textContent =
      "No students remain in the pool.";


    poolList.appendChild(
      message
    );

  }


  else {

    const sorted =
      [...data.pool].sort(
        (a, b) =>
          a.localeCompare(b)
      );


    sorted.forEach(name => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "pool-name";


      item.textContent =
        name;


      poolList.appendChild(
        item
      );

    });

  }


  poolModal.classList.add(
    "visible"
  );

}



function closePoolViewer() {

  poolModal.classList.remove(
    "visible"
  );

}



/* =========================================================
   EVENTS
========================================================= */

spinButton.addEventListener(
  "click",
  spin
);


removeButton.addEventListener(
  "click",
  removePendingStudent
);


keepButton.addEventListener(
  "click",
  keepPendingStudent
);


rosterButton.addEventListener(
  "click",
  openRosterEditor
);


poolButton.addEventListener(
  "click",
  openPoolViewer
);


undoButton.addEventListener(
  "click",
  undoLastAction
);


resetButton.addEventListener(
  "click",
  resetPool
);


saveRosterButton.addEventListener(
  "click",
  saveRoster
);


cancelRosterButton.addEventListener(
  "click",
  closeRosterEditor
);


closeRosterModal.addEventListener(
  "click",
  closeRosterEditor
);


closePoolModal.addEventListener(
  "click",
  closePoolViewer
);



/* Click outside modal */

rosterModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      rosterModal
    ) {

      closeRosterEditor();

    }

  }
);


poolModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      poolModal
    ) {

      closePoolViewer();

    }

  }
);



/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    const isTyping =
      document.activeElement
        .tagName ===
      "TEXTAREA";


    /*
      Spacebar selects student.
    */

    if (
      event.code ===
        "Space" &&
      !isTyping &&
      !rosterModal.classList.contains(
        "visible"
      ) &&
      !poolModal.classList.contains(
        "visible"
      )
    ) {

      event.preventDefault();


      if (!pendingStudent) {

        spin();

      }

    }


    /*
      Escape closes modals.
    */

    if (
      event.key ===
      "Escape"
    ) {

      closeRosterEditor();

      closePoolViewer();

    }

  }
);



/* =========================================================
   START APP
========================================================= */

buildPeriodButtons();

updateUI();


</script>

</body>
</html>
